name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "deny.toml"
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - "Cargo.toml"
      - "deny.toml"
      - .github/workflows/audit.yml
  schedule:
    # Catch newly published advisories against dependencies that haven't
    # changed. On this trigger rustsec/audit-check files a GitHub issue per
    # advisory instead of failing a check.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This is a library, so Cargo.lock isn't committed. rustsec/audit-check
  # runs `cargo audit --file ./Cargo.lock` and needs one, so resolve a
  # fresh lockfile first — that's also the graph downstream users get.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # License compliance: every dependency's license needs to be on the
  # allow-list in deny.toml — a new dependency with an unreviewed license
  # fails this instead of silently being distributed under it.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: licenses
