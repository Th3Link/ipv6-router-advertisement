[package]
name = "ipv6-router-advertisement"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Low-level, policy-free processing of IPv6 Router Advertisements"
repository = "https://github.com/Th3Link/ipv6-router-advertisement"
readme = "README.md"
keywords = ["ipv6", "networking", "router-advertisement"]
categories = ["network-programming"]

[dependencies]
tokio               = { version = "1", features = ["full"] }
tokio-util          = { version = "0.7" }
tokio-stream        = { version = "0.1" }
futures             = { version = "0.3" }
anyhow              = { version = "1.0" }
thiserror           = { version = "2" }
libc                = { version = "0.2" }
async-trait         = { version = "0.1" }
socket2             = { version = "0.6" }
tracing             = { version = "0.1" }

[dev-dependencies]
tokio-stream        = { version = "0.1", features = ["sync"] }
tokio               = { version = "1", features = ["full", "test-util"] }
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
pcap-file           = { version = "2" }
